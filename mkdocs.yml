site_name: tableau-cloud-audit
site_description: Your entire Tableau Cloud estate in one DuckDB file — open-source, pseudonymised by construction.
site_url: https://simboli.github.io/tableau-cloud-audit/
repo_url: https://github.com/simboli/tableau-cloud-audit
repo_name: simboli/tableau-cloud-audit

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Get started:
      - Getting started: getting-started.md
      - Troubleshooting: troubleshooting.md
  - Use it:
      - Query cookbook:
          - Overview: cookbook/index.md
          - Who hasn't signed in for 90+ days?: cookbook/inactive-users.md
          - What is granted to "All Users"?: cookbook/all-users-grants.md
          - Which content shows no access events?: cookbook/unused-content.md
          - Who owns content but isn't in the user listing?: cookbook/ownerless-content.md
          - Where do embedded credentials live?: cookbook/embedded-credentials.md
          - How much content is certified?: cookbook/certified-content.md
          - What does activity look like over time?: cookbook/activity-over-time.md
      - Operations runbook: runbook.md
  - Reference:
      - CLI reference: cli-reference.md
      - Package file schema: package-file-schema.md
      - What we collect: what-we-collect.md
      - API coverage: api-coverage.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences

extra:
  # Ownership codes for the search consoles, rendered as <meta> tags by
  # `overrides/main.html`. Leave a value empty and its tag is not emitted.
  #   google — Search Console, "HTML tag" verification method, content= value only
  #   bing   — Bing Webmaster Tools, msvalidate.01 value (or import from Google,
  #            which verifies without a second code)
  # Property to register is the docs root: https://simboli.github.io/tableau-cloud-audit/
  site_verification:
    google: ""
    bing: ""
