[project]
name = "tableau-cloud-audit"
version = "0.2.0"
description = "Open-source collector for Tableau Cloud: your entire estate in one DuckDB file, pseudonymised by construction."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Nicola Simboli", email = "support@simboli.eu" }]
requires-python = ">=3.11"
keywords = ["tableau", "tableau-cloud", "duckdb", "audit", "governance", "bi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "httpx>=0.27",
  "duckdb>=1.4",
  "typer>=0.12",
  "pydantic>=2.7",
  "rich>=13.7",
]

[project.urls]
Homepage = "https://simboli.github.io/tableau-cloud-audit/"
Documentation = "https://simboli.github.io/tableau-cloud-audit/"
Repository = "https://github.com/simboli/tableau-cloud-audit"
Changelog = "https://github.com/simboli/tableau-cloud-audit/blob/main/CHANGELOG.md"
Issues = "https://github.com/simboli/tableau-cloud-audit/issues"

[project.scripts]
tca = "tca.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-httpx>=0.30",
  "ruff>=0.5",
  "mypy>=1.10",
]
docs = [
  "mkdocs-material>=9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tca"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# typer's declarative defaults are the framework's own idiom
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.11"
strict = false
disallow_untyped_defs = true
files = ["src/tca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
